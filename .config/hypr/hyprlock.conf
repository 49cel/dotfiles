source=~/.local/state/caelestia/theme/hyprlock-colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    color = rgba(181818FF)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = -1

    position = 0, -20
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +'%H:%M')</big></b>"
    color = $text_color
    font_size = 96
    font_family = $font_family_clock

    position = 0, 160
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] echo "$(date +'%A, %B %d')"
    color = $text_color
    font_size = 22
    font_family = $font_family_clock

    position = 0, 75
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = $text_color
    font_size = 18
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -55
    halign = center
    valign = center
}

label { # Layout
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}
